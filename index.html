<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Apply the saved preference before CSS paints to avoid a theme flash.
      try {
        var preference = localStorage.getItem('postflow.theme')
        var theme = preference === 'light' ? 'light' : 'dark'
        if (preference === 'system')
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#fafafa' : '#0a0a0a'
      } catch {}
    </script>
    <meta
      name="description"
      content="PostFlow — planejamento de conteúdo com IA"
    />
    <title>PostFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
